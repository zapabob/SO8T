# OSINT source configuration (edit as needed)
# Provide RSS feeds or GDELT queries for auto source collection.

pop_culture:
  rss: []
  gdelt:
    - name: gdelt_popculture
      query: "anime OR manga OR film OR box office OR videogame OR streaming"
      max_records: 200
      timespan: "365d"

world_affairs:
  rss:
    - https://www.kantei.go.jp/jp/headline.xml # 首相官邸
    - https://www.mofa.go.jp/mofaj/press/release/release.xml # 外務省
    - https://www.mod.go.jp/j/press/news/index.xml # 防衛省
  gdelt:
    - name: gdelt_japan_geopolitics
      query: "(Japan AND (Ukraine OR China OR 'US-China' OR 'cognitive warfare' OR 'military intelligence'))"
      max_records: 500
      timespan: "365d"
    - name: gdelt_global_shifts_2024_2026
      query: "(BRICS OR NATO OR 'Global South' OR 'AI arms race' OR 'semiconductor war' OR 'Trump administration second term')"
      max_records: 500
      timespan: "730d" # 2024年初頭からカバーするため
    - name: gdelt_defense_space
      query: "(JAXA OR 'Self-Defense Forces' OR 'Defense White Paper' OR 'Information Warfare')"
      max_records: 300
      timespan: "3650d"

defense_intelligence:
  rss:
    - https://www.csis.org/rss.xml # CSIS
    - https://rusi.org/rss/all.xml # RUSI
  local_sources:
    - path: "data/defense_white_paper/"
      targets: ["2024", "2025"]
    - path: "data/jaxa_archives/"
      targets: ["AIREX", "EarthAPI"]
