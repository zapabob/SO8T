name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    env:
      GIT_LFS_SKIP_SMUDGE: 1
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python -m pytest tests/ -v --cov=so8t --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy bandit safety

    - name: Run linters
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 so8t/ src/ scripts/ --exclude scripts/training,src/training --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 so8t/ src/ scripts/ --exclude scripts/training,src/training --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check formatting
      run: |
        black --check so8t/ src/ scripts/ --exclude "/scripts/training/|/src/training/"
        isort --check-only so8t/ src/ scripts/ --skip scripts/training --skip src/training

    - name: Type checking
      run: |
        mypy so8t/ src/ --ignore-missing-imports --exclude src/training

    - name: Security scanning
      run: |
        bandit -r so8t/ src/ scripts/ -x scripts/training,src/training -f json -o security_report.json
        safety check --file requirements.txt --json > safety_report.json

  build:
    env:
      GIT_LFS_SKIP_SMUDGE: 1
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        path: dist/
        retention-days: 30