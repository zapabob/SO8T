name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    env:
      GIT_LFS_SKIP_SMUDGE: 1
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python -m pytest src/evaluation/tests/test_ci_smoke.py -v --cov=so8t --cov-report=xml
        python src/evaluation/tests/test_minimal.py
        python src/evaluation/tests/test_imports.py

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy bandit safety

    - name: Run linters
      run: |
        # Syntax errors and undefined names (critical - includes src/training)
        flake8 so8t/ src/ scripts/ --exclude src/external,src/core/inference/tests,src/core/models/so8t_residual_adapter_old.py,scripts/conversion --count --select=E9,F63,F7,F82 --show-source --statistics
        # Style warnings (exit-zero, non-blocking)
        flake8 so8t/ src/ scripts/ --exclude src/external,src/training,src/core/inference/tests,src/core/models/so8t_residual_adapter_old.py,scripts/conversion,scripts/training --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check formatting
      run: |
        black --check so8t/
        isort --check-only so8t/

    - name: Type checking
      run: |
        mypy so8t/ src/utils/ src/core/models/ src/infrastructure/pipeline/ --ignore-missing-imports --exclude "src/core/models/so8t_residual_adapter_old.py"

    - name: Security scanning
      run: |
        bandit -r so8t/ src/utils/ src/core/ src/infrastructure/pipeline/ -x src/core/inference/tests,src/core/models/so8t_residual_adapter_old.py -f json -o security_report.json || true
        safety check --file requirements.txt --json > safety_report.json || true

  build:
    env:
      GIT_LFS_SKIP_SMUDGE: 1
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        path: dist/
        retention-days: 30
