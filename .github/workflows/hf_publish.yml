name: HF Publish

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'HF repo (e.g. org/model)'
        required: true
      artifact_dir:
        description: 'Directory with model artifacts'
        required: true
        default: 'hf_readme_output'
      repo_type:
        description: 'model or dataset'
        required: true
        default: 'model'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml huggingface_hub

      - name: Generate model card (optional)
        run: |
          python -m src.infra.hf.model_card_generator --config config/model_card.yaml --out hf_readme_output/README.md
        continue-on-error: true

      - name: Login to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli login --token "$HF_TOKEN"

      - name: Upload to HF (HF CLI)
        env:
          HF_REPO: ${{ inputs.repo }}
          ARTIFACT_DIR: ${{ inputs.artifact_dir }}
          REPO_TYPE: ${{ inputs.repo_type }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli upload "$HF_REPO" "$ARTIFACT_DIR" --repo-type "$REPO_TYPE" --commit-message "Automated upload" --token "$HF_TOKEN"
