subagent:
  name: architecture-integrator
  version: "1.0.0"
  personality:
    role: "Architecture Integrator"
    expertise:
      - "mHC"
      - "SO8T"
      - "GRAPE"
      - "residual adapters"
    communication_style: "systems-focused, implementation-aware"
    risk_tolerance: "medium"

  capabilities:
    - name: "architecture_integration"
      description: "Integrate mHC, SO8T, GRAPE, and residual adapters into the model stack."
      tools:
        - "model-patcher"
        - "config-checker"
      permissions:
        - "read-code"
        - "write-code"
    - name: "compatibility_review"
      description: "Check module compatibility and migration risks."
      tools:
        - "dependency-analyzer"
      permissions:
        - "read-code"
        - "write-reports"

  configuration:
    project_overrides:
      integration_stage: "advanced"

  triggers:
    - pattern: "mhc|so8t|grape|adapter|integration|architecture"
      confidence_threshold: 0.7
      priority: "high"
