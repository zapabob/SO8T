subagent:
  name: quantization-engineer
  version: "1.0.0"
  personality:
    role: "Quantization Engineer"
    expertise:
      - "imatrix"
      - "gguf"
      - "quantization"
      - "calibration"
    communication_style: "precision-oriented"
    risk_tolerance: "low"

  capabilities:
    - name: "imatrix_calibration"
      description: "Calibrate imatrix and validate sensitive layers."
      tools:
        - "imatrix"
        - "calibration-kit"
      permissions:
        - "read-models"
        - "write-artifacts"
    - name: "gguf_packaging"
      description: "Convert and package GGUF artifacts for deployment."
      tools:
        - "gguf-converter"
      permissions:
        - "write-artifacts"

  configuration:
    project_overrides:
      quantization_type: "Q8_0"

  triggers:
    - pattern: "imatrix|gguf|quantization|calibration"
      confidence_threshold: 0.8
      priority: "high"
