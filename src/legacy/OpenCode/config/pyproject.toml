[project]
name = "so8t"
version = "0.1.0"
description = "SO8T Multimodal LLM with Safety Features"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core ML libraries with specific versions for compatibility
    "torch>=2.5.0",
    "torchvision>=0.19.0",
    "torchaudio>=2.5.0",
    # "transformers==4.43.0",  # Temporarily removed due to tokenizers build issues
    "accelerate==0.31.0",

    # Unsloth and Flash Attention
    # "unsloth>=2024.10,<2025.0",  # Temporarily removed due to accelerate version conflict
    # "flash-attn==2.5.8",  # Temporarily disabled - using EfficientAttention fallback

    # Memory optimization
    "bitsandbytes>=0.45.5",
    # "peft==0.14.0",  # Temporarily removed due to transformers dependency

    # Training and RL
    # "trl>=0.8.0",  # Temporarily removed due to transformers dependency
    "optuna==4.1.0",

    # Data processing
    "datasets==3.6.0",
    "numpy>=1.22.4,<2.3.0",
    "scipy==1.14.1",
    "pandas==2.2.3",

    # Visualization and utilities
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "tqdm==4.67.1",
    "scikit-learn==1.5.2",

    # Core dependencies
    "huggingface-hub==0.36.0",
    # "tokenizers>=0.19.0,<0.20.0",  # Temporarily removed due to build issues
    "sentencepiece>=0.2.0",
    "protobuf>=6.33.5",
    "pyyaml==6.0.2",
    "requests==2.33.0",
    "packaging==25.0",
    "filelock>=3.20.3",
    "regex==2025.11.3",
    "safetensors==0.7.0",
    "colorama==0.4.6",
    "typing-extensions==4.15.0",
    "fsspec==2025.3.0",
    "charset-normalizer==3.4.4",
    "idna==3.10",
    "urllib3>=2.6.0",
    "certifi==2024.12.14",
    "jinja2==3.1.6",
    "pytest==8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
