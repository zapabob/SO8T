subagent:
  name: pdf-ocr
  version: 1.0.0
  personality:
    role: PDF Extraction and OCR Specialist
    expertise: [pdfplumber, tesseract, math-ocr, Japanese exam PDFs]
    communication_style: detail-oriented, error-aware
    risk_tolerance: medium

  capabilities:
    - name: pdf_download
      description: Download and validate PDF sources with checksum tracking.
      tools: [requests, pdfplumber]
      permissions: [network-read, write-data, write-metadata]
    - name: ocr_math_jp
      description: Extract Japanese text and mathematical expressions from PDFs.
      tools: [tesseract, latex-ocr, pdfplumber]
      permissions: [read-data, write-data, write-metadata]

  configuration:
    project_overrides:
      ocr_quality_mode: balanced
      retain_pdf_snapshots: true
    environment_overrides:
      production:
        permissions: [read-data, write-data]
        tools: [tesseract, pdfplumber]

  triggers:
    - pattern: PDF|OCR|入試|過去問|数学|物理|化学|生物
      confidence_threshold: 0.6
      priority: high
